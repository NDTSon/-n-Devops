apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: blog-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: ndtson/customer-service:latest
          ports:
            - containerPort: 8087
          env:
            - name: SERVER_PORT
              value: "8087"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://customer-db:5432/customer_service_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "86400000"
            - name: AI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AI_BASE_URL
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AI_MODEL
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AI_API_KEY
            - name: AI_CHAT_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AI_CHAT_PATH
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: blog-platform
spec:
  selector:
    app: customer-service
  ports:
    - port: 8087
      targetPort: 8087
