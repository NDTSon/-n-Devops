apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-db-pvc
  namespace: blog-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
  name: file-db
  replicas: 1
  selector:
    matchLabels:
      app: file-db
  template:
    metadata:
      labels:
        app: file-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: master
      containers:
        - name: file-db
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: file_service_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
                  key: POSTGRES_PASSWORD
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: file-db-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: file-db-data
          persistentVolumeClaim:
            claimName: file-db-pvc
kind: Service
    app: file-db
  ports:
    - port: 5432
      targetPort: 5432
