apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-platform-ingress
  namespace: blog-platform
spec:
  ingressClassName: traefik
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
