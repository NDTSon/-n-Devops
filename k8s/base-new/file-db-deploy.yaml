apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-db
  namespace: blog-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-db
  template:
    metadata:
      labels:
        app: file-db
    spec:
      containers:
        - name: file-db
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: file_service_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
